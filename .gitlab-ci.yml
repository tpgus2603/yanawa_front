stages:
  - build
  - deploy

build:
  stage: build
  image: node:16
  tags: 
    - react # Runner 태그와 일치해야 함
  before_script:
    # Base64로 인코딩된 환경변수를 디코딩하여 .env 파일 생성
    - echo "$ENV_FILE_BASE64" | base64 -d > .env
  script:
    # React 프로젝트 설치 및 빌드
    - npm install
    - npm run build
  artifacts:
    paths:
      - build/ # 빌드 결과물을 아티팩트로 저장

deploy:
  stage: deploy
  image: ubuntu:20.04 # Ubuntu 이미지 사용
  tags:
    - react 
  before_script:
    before_script:
    # apt-get으로 openssh-client 설치
    - apt-get update && apt-get install -y openssh-client
    # .ssh 디렉토리 생성
    - mkdir -p ~/.ssh
    # Base64로 인코딩된 SSH 키 디코딩 및 파일 생성
    - echo "$SSH_PEM_KEY_BASE64" | base64 -d > ~/.ssh/id_rsa.pem
    - chmod 600 ~/.ssh/id_rsa.pem
  script:
    # 원격 서버에 디렉토리 생성 및 권한 설정
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa.pem $SSH_USER@$EC2_HOST "sudo mkdir -p /var/www/yanawa.shop && sudo chown -R $SSH_USER:$SSH_USER /var/www/yanawa.shop"
    # Base64 디코딩으로 .env 파일 생성
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa.pem $SSH_USER@$EC2_HOST "echo '$ENV_FILE_BASE64' | base64 -d > /var/www/yanawa.shop/.env"
    # 파일 업로드
    - scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa.pem -r build/* $SSH_USER@$EC2_HOST:/var/www/yanawa.shop
    # Nginx 재시작
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa.pem $SSH_USER@$EC2_HOST "sudo systemctl reload nginx"
  only:
    - main  # main 브랜치에 푸시될 때만 실행